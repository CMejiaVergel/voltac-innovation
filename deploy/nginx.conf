# Nginx — innovation.voltac.com.co
#
# El VPS aloja varias aplicaciones. Esta escucha en el puerto 3007, no en el
# 3000: ese ya estaba ocupado por otro proyecto. El numero vive aqui y en
# deploy/ecosystem.config.js; si se cambia, hay que cambiarlo en los dos.
#
# Instalar en el VPS como /etc/nginx/sites-available/innovation.voltac.com.co
# y enlazar a sites-enabled. El bloque SSL lo escribe certbot; este archivo
# arranca solo con HTTP para que certbot pueda validar el dominio.
#
#   sudo ln -s /etc/nginx/sites-available/innovation.voltac.com.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d innovation.voltac.com.co

server {
    listen 80;
    listen [::]:80;
    server_name innovation.voltac.com.co;

    # Tamaño de subida: el brief y el JSON de importacion son pequeños, pero
    # dejamos margen para exportaciones grandes.
    client_max_body_size 8m;

    access_log /var/log/nginx/voltac-innovation.access.log;
    error_log  /var/log/nginx/voltac-innovation.error.log;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # El agente investigador se lanza en segundo plano, asi que ninguna
        # peticion deberia tardar minutos. Aun asi damos margen holgado para
        # que un arranque en frio no devuelva 504.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Los assets con hash de Next son inmutables.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
